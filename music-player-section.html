    <!-- ====== MUSIC PLAYER ====== -->
    <section id="music-section" class="music-player-bar">
        <div class="music-container">
            <div class="music-info">
                <i class="fas fa-music music-icon" id="musicStatusIcon"></i>
                <span class="music-title">Memorial Hymn</span>
                <span class="music-artist">— Eternal Peace</span>
                <span class="music-status" id="musicStatus">● Playing</span>
            </div>
            <div class="music-controls">
                <button class="music-btn" id="musicPlayBtn">
                    <i class="fas fa-play" id="musicPlayIcon"></i>
                </button>
                <input type="range" class="music-volume" id="musicVolume" min="0" max="1" step="0.01" value="0.5" />
                <span class="volume-icon"><i class="fas fa-volume-up"></i></span>
            </div>
        </div>
    </section>
